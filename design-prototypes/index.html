<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCoding 配色展示</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f5f5;color:#333;padding:20px}
h1{font-size:18px;font-weight:600;margin-bottom:20px;color:#555}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:1200px;margin:0 auto}
.phone{width:100%;aspect-ratio:390/780;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:center;margin-bottom:4px;opacity:.6}
.chat-header{padding:10px 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.chat-header .dot{width:6px;height:6px;border-radius:3px;background:#4ade80}
.chat-header .info{flex:1}
.chat-header .info h2{font-size:11px;font-weight:600}
.chat-header .info p{font-size:9px;opacity:.5;margin-top:1px}
.chat-header .gear{font-size:12px;opacity:.5}
.chat-area{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.msg{max-width:90%;padding:6px 10px;border-radius:14px;font-size:10px;line-height:1.45;animation:none}
.msg.user{align-self:flex-end;border-bottom-right-radius:3px}
.msg.assistant{align-self:flex-start;border-bottom-left-radius:3px}
.msg .t{font-size:7px;opacity:.35;margin-top:2px;text-align:right}
.msg.assistant .code{background:var(--code);border-radius:4px;padding:4px 6px;margin:4px 0;font-size:9px;font-family:monospace;border-left:2px solid var(--accent)}
.input-bar{padding:6px 10px 10px;display:flex;gap:4px}
.input-bar input{flex:1;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:10px;outline:none;background:var(--input);color:var(--text)}
.input-bar input::placeholder{color:var(--placeholder)}
.input-bar button{width:28px;height:28px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:12px;cursor:pointer}

.themes{display:flex;gap:16px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.theme-btn{padding:6px 14px;border-radius:8px;border:1px solid rgba(0,0,0,.1);background:rgba(0,0,0,.04);color:#333;font-size:11px;cursor:pointer;font-family:inherit;transition:.15s}
.theme-btn:hover{background:rgba(0,0,0,.08)}
.theme-btn.active{background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.2)}
.mode-bar{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.mode-btn{padding:6px 20px;border-radius:8px;border:1px solid rgba(0,0,0,.1);background:rgba(0,0,0,.04);color:#333;font-size:11px;cursor:pointer;font-family:inherit}
.mode-btn.active{background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.2)}
</style>
</head>
<body>
<h1>VibeCoding · 配色展示</h1>
<div class="mode-bar">
  <button class="mode-btn active" data-view="all" onclick="setView('all')">All 10</button>
  <button class="mode-btn" data-view="dark" onclick="setView('dark')">Dark Only</button>
  <button class="mode-btn" data-view="light" onclick="setView('light')">Light Only</button>
  <button class="mode-btn" data-view="row" onclick="setView('row')">Side by Side</button>
</div>
<div class="grid" id="gallery"></div>

<script>
const THEMES = {
  zinc:   { name:'Zinc',   desc:'Emerald · Professional' },
  slate:  { name:'Slate',  desc:'Blue · Calm' },
  forest: { name:'Forest', desc:'Green · Nature' },
  rose:   { name:'Rose',   desc:'Red · Bold' },
  amber:  { name:'Amber',  desc:'Yellow · Warm' },
};

const COLORS = {
  zinc: {
    dark:  { bg:'#09090b',surface:'#18181b',text:'#fafafa',text2:'#a1a1aa',accent:'#34d399',border:'rgba(255,255,255,.06)',input:'#27272a',placeholder:'rgba(255,255,255,.35)',code:'rgba(0,0,0,.15)' },
    light: { bg:'#fafafa',surface:'#fff',text:'#3f3f46',text2:'#a1a1aa',accent:'#10b981',border:'rgba(0,0,0,.06)',input:'#f4f4f5',placeholder:'rgba(0,0,0,.35)',code:'rgba(0,0,0,.04)' },
  },
  slate: {
    dark:  { bg:'#020617',surface:'#1e293b',text:'#f8fafc',text2:'#94a3b8',accent:'#60a5fa',border:'rgba(255,255,255,.06)',input:'#334155',placeholder:'rgba(255,255,255,.35)',code:'rgba(0,0,0,.15)' },
    light: { bg:'#f8fafc',surface:'#fff',text:'#334155',text2:'#94a3b8',accent:'#3b82f6',border:'rgba(0,0,0,.06)',input:'#f1f5f9',placeholder:'rgba(0,0,0,.35)',code:'rgba(0,0,0,.04)' },
  },
  forest: {
    dark:  { bg:'#052e16',surface:'#14532d',text:'#f0fdf4',text2:'#86efac',accent:'#22c55e',border:'rgba(255,255,255,.06)',input:'#166534',placeholder:'rgba(255,255,255,.35)',code:'rgba(0,0,0,.15)' },
    light: { bg:'#f0fdf4',surface:'#fff',text:'#166534',text2:'#4ade80',accent:'#16a34a',border:'rgba(0,0,0,.06)',input:'#dcfce7',placeholder:'rgba(0,0,0,.35)',code:'rgba(0,0,0,.04)' },
  },
  rose: {
    dark:  { bg:'#1f0a0c',surface:'#3b0d12',text:'#fff1f2',text2:'#fda4af',accent:'#fb7185',border:'rgba(255,255,255,.06)',input:'#4c1319',placeholder:'rgba(255,255,255,.35)',code:'rgba(0,0,0,.15)' },
    light: { bg:'#fff1f2',surface:'#fff',text:'#881337',text2:'#e11d48',accent:'#e11d48',border:'rgba(0,0,0,.06)',input:'#ffe4e6',placeholder:'rgba(0,0,0,.35)',code:'rgba(0,0,0,.04)' },
  },
  amber: {
    dark:  { bg:'#1c1402',surface:'#422006',text:'#fffbeb',text2:'#fde68a',accent:'#fbbf24',border:'rgba(255,255,255,.06)',input:'#5c3706',placeholder:'rgba(255,255,255,.35)',code:'rgba(0,0,0,.15)' },
    light: { bg:'#fffbeb',surface:'#fff',text:'#78350f',text2:'#b45309',accent:'#d97706',border:'rgba(0,0,0,.06)',input:'#fef3c7',placeholder:'rgba(0,0,0,.35)',code:'rgba(0,0,0,.04)' },
  },
};

function buildPhone(themeKey, mode) {
  const c = COLORS[themeKey][mode];
  const t = THEMES[themeKey];
  const p = document.createElement('div');
  p.className = 'phone';
  p.style.setProperty('--border', c.border);
  p.style.setProperty('--accent', c.accent);
  p.style.setProperty('--input', c.input);
  p.style.setProperty('--placeholder', c.placeholder);
  p.style.setProperty('--code', c.code);
  p.style.backgroundColor = c.bg;
  p.style.color = c.text;

  p.innerHTML = `
    <div class="chat-header" style="background:${c.surface}">
      <div class="dot"></div>
      <div class="info">
        <h2 style="color:${c.text}">esp32 固件开发</h2>
        <p style="color:${c.placeholder}">Connected · opencode</p>
      </div>
      <div class="gear" style="color:${c.text2}">☰</div>
    </div>
    <div class="chat-area">
      <div class="msg user" style="background:${c.accent};color:#fff">帮我写一个 React 组件</div>
      <div class="msg assistant" style="background:${c.surface};color:${c.text}">
        <div style="margin-bottom:2px">基于 @dnd-kit：</div>
        <div class="code" style="background:${c.code}">import { DndContext } from "@dnd-kit/core";</div>
        <div class="t" style="color:${c.placeholder}">14:23</div>
      </div>
      <div class="msg user" style="background:${c.accent};color:#fff">支持触摸设备吗？</div>
      <div class="msg assistant" style="background:${c.surface};color:${c.text}">
        @dnd-kit 原生支持触摸事件，不需要额外配置。在移动设备上会自动切换到拖拽手势。
        <div class="t" style="color:${c.placeholder}">14:24</div>
      </div>
    </div>
    <div class="input-bar" style="background:${c.bg}">
      <input placeholder="Type a message..." style="background:${c.input};color:${c.text};border-color:${c.border}">
      <button style="background:${c.accent}">↑</button>
    </div>
  `;
  return p;
}

function render(view) {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  const modes = view === 'all' ? ['dark','light'] : [view];
  const keys = Object.keys(THEMES);
  
  if (view === 'row') {
    gallery.style.gridTemplateColumns = 'repeat(5,1fr)';
    gallery.innerHTML = '<div class="label" style="grid-column:1/6;margin-top:8px">DARK</div>';
    keys.forEach(k => { const p=buildPhone(k,'dark'); gallery.appendChild(p); });
    const lbl = document.createElement('div');
    lbl.className = 'label'; lbl.style.gridColumn = '1/6'; lbl.style.marginTop = '16px';
    lbl.textContent = 'LIGHT';
    gallery.appendChild(lbl);
    keys.forEach(k => { const p=buildPhone(k,'light'); gallery.appendChild(p); });
    return;
  }
  
  gallery.style.gridTemplateColumns = `repeat(${modes.length === 1 ? 5 : 5},1fr)`;
  if (modes.length === 2) {
    const l = document.createElement('div');
    l.className = 'label'; l.style.gridColumn = '1/6';
    l.textContent = 'DARK';
    gallery.appendChild(l);
    keys.forEach(k => { const p=buildPhone(k,'dark'); const lbl=document.createElement('div'); lbl.className='label'; lbl.textContent=k; gallery.appendChild(lbl); gallery.appendChild(p); });
    const l2 = document.createElement('div');
    l2.className = 'label'; l2.style.gridColumn = '1/6'; l2.style.marginTop = '12px';
    l2.textContent = 'LIGHT';
    gallery.appendChild(l2);
    keys.forEach(k => { const p=buildPhone(k,'light'); const lbl=document.createElement('div'); lbl.className='label'; lbl.textContent=k; gallery.appendChild(lbl); gallery.appendChild(p); });
  } else {
    keys.forEach(k => { const p=buildPhone(k,view); gallery.appendChild(p); });
  }
}

function setView(v) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  render(v);
}

render('all');
</script>
</body>
</html>
